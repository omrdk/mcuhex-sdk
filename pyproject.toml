[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhex-sdk"
version = "0.2.0"
requires-python = ">=3.8"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["probe*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
